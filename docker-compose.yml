# =============================================================================
# GamePort
#
#   cp .env.example .env      # isi GAMEDB_PASSWORD dan ADMIN_PASSWORD
#   docker compose up -d --build
#   open http://127.0.0.1:8181
#
# Layanan: db (PostgreSQL) + backend (Go, API + frontend + admin)
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: gameport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAMEDB_NAME:-gamedb}
      POSTGRES_USER: ${GAMEDB_USER:-gameport}
      POSTGRES_PASSWORD: ${GAMEDB_PASSWORD:?set GAMEDB_PASSWORD di .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dijalankan HANYA saat volume masih kosong (inisialisasi pertama)
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAMEDB_USER:-gameport} -d ${GAMEDB_NAME:-gamedb}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [gameport]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gameport-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GAMEDB_HOST: db
      GAMEDB_PORT: "5432"
      GAMEDB_NAME: ${GAMEDB_NAME:-gamedb}
      GAMEDB_USER: ${GAMEDB_USER:-gameport}
      GAMEDB_PASSWORD: ${GAMEDB_PASSWORD:?set GAMEDB_PASSWORD di .env}
      APP_HOST: 0.0.0.0
      APP_PORT: "8181"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD di .env}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      # Opsional: hash SHA-256 sebagai ganti plaintext di .env
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:-}
      # Link gambar absolut dari origin api (frontend ada di Vercel)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Gerbang iklan sebelum unduhan (script iklannya di tabel settings DB)
      SAFELINK_ENABLED: ${SAFELINK_ENABLED:-false}
      SAFELINK_WAIT: ${SAFELINK_WAIT:-10}
      SAFELINK_TTL: ${SAFELINK_TTL:-300}
    ports:
      # Bind ke localhost; pasang Caddy/nginx untuk publik
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8181}:8181"
    volumes:
      # Gambar lama dari fitur unggah yang sudah dihapus (read-only)
      - ./uploads:/app/uploads
    networks: [gameport]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8181/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── seeder: isi/segarkan katalog dari rilis GitHub tiap hari ──
  # Bukan cron, bukan root: proses kecil yang menunggu jam SEED_HOUR_UTC
  # (default 0 = 07:00 WIB), menjalankan tools/seed-github.py --update,
  # lalu menulis hasilnya langsung ke service db lewat psql.
  seeder:
    # MATI secara default. Sengaja di balik profile supaya
    # "docker compose up -d" tidak pernah menyalakannya.
    # Nyalakan hanya bila diminta:  docker compose --profile seeder up -d
    profiles: ["seeder"]
    build:
      context: .
      dockerfile: tools/Dockerfile.seeder
    container_name: gameport-seeder
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${GAMEDB_USER:-gameport}
      PGDATABASE: ${GAMEDB_NAME:-gamedb}
      PGPASSWORD: ${GAMEDB_PASSWORD:?set GAMEDB_PASSWORD di .env}
      SEED_HOUR_UTC: ${SEED_HOUR_UTC:-0}
      # true = langsung jalan saat container menyala (bukan menunggu jam)
      SEED_RUN_ON_START: ${SEED_RUN_ON_START:-true}
    networks: [gameport]

volumes:
  pgdata:
    name: gameport-pgdata

networks:
  gameport:
    name: alpha
    # Network "alpha" sudah dibuat oleh deployment Hermes — compose
    # hanya ikut, bukan membuat. Tanpa external: true, docker compose
    # menolak karena label network tidak cocok.
    external: true