# =============================================================================
# GamePort — docker compose
#
#   cp .env.example .env      # lalu isi password
#   docker compose up -d --build
#   open http://127.0.0.1:8181
#
# Layanan:
#   db        PostgreSQL 17, seed otomatis dari db/seed.sql saat volume baru
#   backend   Go server, menyajikan API + frontend statis
#
# Volume `pgdata` menyimpan data. Hapus untuk mulai dari nol:
#   docker compose down -v
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: gameport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAMEDB_NAME:-gamedb}
      POSTGRES_USER: ${GAMEDB_USER:-gameport}
      POSTGRES_PASSWORD: ${GAMEDB_PASSWORD:?set GAMEDB_PASSWORD di .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dijalankan HANYA saat volume masih kosong (inisialisasi pertama)
      - ./db/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAMEDB_USER:-gameport} -d ${GAMEDB_NAME:-gamedb}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [gameport]
    # Tanpa port publish: hanya backend yang perlu akses.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gameport-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GAMEDB_HOST: db
      GAMEDB_PORT: "5432"
      GAMEDB_NAME: ${GAMEDB_NAME:-gamedb}
      GAMEDB_USER: ${GAMEDB_USER:-gameport}
      GAMEDB_PASSWORD: ${GAMEDB_PASSWORD:?set GAMEDB_PASSWORD di .env}
      APP_PORT: "8181"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8181}:8181"
    networks: [gameport]

  # Muat 210 port dari sumber (butuh internet). Bukan daemon:
  #   docker compose run --rm etl
  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GAMEDB_HOST: db
      GAMEDB_PORT: "5432"
      GAMEDB_NAME: ${GAMEDB_NAME:-gamedb}
      GAMEDB_USER: ${GAMEDB_USER:-gameport}
      GAMEDB_PASSWORD: ${GAMEDB_PASSWORD:?set GAMEDB_PASSWORD di .env}
    volumes:
      - ./etl:/app/etl:ro
    command: ["python", "etl/etl.py"]
    networks: [gameport]

volumes:
  pgdata:
    name: gameport-pgdata

networks:
  gameport:
    name: gameport-net